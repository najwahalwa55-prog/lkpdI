<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Form Login</title>
  <link rel="stylesheet" href="style.css">
</head>
  <style>
  * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}
body {
  background-color: #0a6b3c;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  flex-direction: column;
  gap: 40px;
  padding: 40px;
}
.form-box {
  background-color: #c8ddd2;
  width: 340px;
  padding: 25px;
}
.form-box h2 {
  font-size: 16px;
  margin-bottom: 15px;
}
.form-box input {
  width: 100%;
  padding: 8px 10px;
  margin-bottom: 10px;
  border: 1px solid #ccc;
  font-size: 12px;
}
.link-kecil {
  font-size: 10px;
  color: #4a7a6b;
  text-decoration: underline;
  display: block;
  margin-bottom: 12px;
}
.btn {
  width: 100%;
  background-color: #3a8a67;
  color: white;
  border: none;
  padding: 8px;
  font-size: 11px;
  cursor: pointer;
  border-radius: 3px;
  margin-bottom: 10px;
}
.bawah {
font-size: 11px;
  text-align: center;
}
.bawah a {
  color: #3a8a67;
  font-weight: bold;
}
    </style>
<body>
  <div class="form-box">
    <h2>Form Login</h2>
    <input type="email" placeholder="Masukkan email">
    <input type="password" placeholder="Masukkan password">
    <a class="link-kecil">Lupa Password ?</a>
    <button class="btn">Login</button>
    <p class="bawah">Belum punya akun? <a href="register.html">Daftar.</a></p>
  </div>
</body>
</html>
